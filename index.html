<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belle Mode</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">Belle Mode</h1>
    <button id="cart-toggle" class="cart-button" aria-label="Open cart">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h2>Effortless style, every day</h2>
    <p>Fresh pieces for every season.</p>
  </section>

  <main>
    <nav id="filters" class="filters" aria-label="Product categories"></nav>
    <div id="grid" class="grid"></div>
  </main>

  <aside id="cart" class="cart" aria-label="Shopping cart" hidden>
    <div class="cart-head">
      <h3>Your cart</h3>
      <button id="cart-close" aria-label="Close cart">&times;</button>
    </div>
    <ul id="cart-items" class="cart-items"></ul>
    <div class="cart-foot">
      <strong>Total: $<span id="cart-total">0.00</span></strong>
      <button id="checkout" class="primary">Checkout</button>
    </div>
  </aside>

  <footer class="site-footer">&copy; Belle Mode</footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
